<a class="back-link" routerLink="products">Back</a>
@if (signalStore.product(); as product) {
  <div class="detail-container">
    <app-product-image [imageUrl]="product.imageUrl" />

    <app-product-info
      [product]="product"
      (addToCartClicked)="onAddToCartClicked($event)"
    />
  </div>
}
