<div class="products-list">
  @for (productCategory of signalStore.productsByCategory(); track productCategory.category) {
    <app-product-category
      [categoryName]="productCategory.category | categoryName"
      [products]="productCategory.products"
      (clicked)="signalStore.navigateToDetail($event)"
      (cartClicked)="onCartClicked($event)"
    />
  }
</div>
