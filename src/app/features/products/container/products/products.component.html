<div class="products-list">
  @for (productCategory of productsStore.productsByCategory(); track productCategory.category) {
    <app-product-category
      [categoryName]="productCategory.category | categoryName"
      [products]="productCategory.products"
      (clicked)="productsStore.navigateToDetail($event)"
      (cartClicked)="checkoutStore.addProductToCart($event)"
    />
  }
</div>
